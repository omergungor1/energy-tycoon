<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="batSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041a1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cabinetBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="doorBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="batGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#batSky)" />

  <!-- Cyber Circuit Background Lines -->
  <path d="M 30 180 H 90 L 120 150 H 180" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35" />
  <path d="M 370 180 H 310 L 280 150 H 220" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35" />
  <circle cx="120" cy="150" r="3" fill="#10b981" opacity="0.6" />
  <circle cx="280" cy="150" r="3" fill="#06b6d4" opacity="0.6" />

  <!-- Ground Concrete Foundation Slab -->
  <polygon points="40,215 360,215 330,185 70,185" fill="#1e293b" />
  <polygon points="50,212 350,212 324,188 76,188" fill="#334155" />

  <!-- Left Secondary Container (Background) -->
  <polygon points="68,186 130,186 130,110 68,110" fill="#94a3b8" />
  <polygon points="68,110 130,110 148,94 86,94" fill="#cbd5e1" />
  <polygon points="130,186 148,168 148,94 130,110" fill="#64748b" />

  <!-- Right Secondary Container (Background) -->
  <polygon points="270,186 332,186 332,110 270,110" fill="#94a3b8" />
  <polygon points="270,110 332,110 350,94 288,94" fill="#cbd5e1" />
  <polygon points="332,186 350,168 350,94 332,110" fill="#64748b" />

  <!-- Center Flagship Megapack Container (3D Isometric Front) -->
  <!-- Top Roof -->
  <polygon points="110,95 290,95 268,72 132,72" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Roof AC/Cooling Pods -->
  <rect x="145" y="74" width="46" height="12" rx="2" fill="#94a3b8" />
  <rect x="209" y="74" width="46" height="12" rx="2" fill="#94a3b8" />

  <!-- Main Front Face -->
  <rect x="110" y="95" width="180" height="96" rx="4" fill="url(#cabinetBody)" stroke="#cbd5e1" stroke-width="2" />

  <!-- 4 Modular Battery Bay Doors -->
  <!-- Bay 1 -->
  <rect x="118" y="103" width="37" height="80" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="122" y="108" width="29" height="16" rx="1.5" fill="#1e293b" />
  <!-- Ventilation Slits -->
  <line x1="124" y1="134" x2="147" y2="134" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="124" y1="138" x2="147" y2="138" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="124" y1="142" x2="147" y2="142" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="124" y1="146" x2="147" y2="146" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Bay 2 -->
  <rect x="160" y="103" width="37" height="80" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="164" y="108" width="29" height="16" rx="1.5" fill="#1e293b" />
  <!-- Ventilation Slits -->
  <line x1="166" y1="134" x2="189" y2="134" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="166" y1="138" x2="189" y2="138" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="166" y1="142" x2="189" y2="142" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="166" y1="146" x2="189" y2="146" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Bay 3 -->
  <rect x="203" y="103" width="37" height="80" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="207" y="108" width="29" height="16" rx="1.5" fill="#1e293b" />
  <!-- Ventilation Slits -->
  <line x1="209" y1="134" x2="232" y2="134" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="209" y1="138" x2="232" y2="138" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="209" y1="142" x2="232" y2="142" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="209" y1="146" x2="232" y2="146" stroke="#94a3b8" stroke-width="1.2" />

  <!-- Bay 4 (Inverter & Power Distribution) -->
  <rect x="245" y="103" width="37" height="80" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" />
  <rect x="249" y="108" width="29" height="16" rx="1.5" fill="#1e293b" />
  <!-- Digital UI / Meter Display -->
  <rect x="252" y="111" width="23" height="10" fill="#020617" />
  <text x="254" y="119" font-family="monospace" font-size="7" fill="#10b981" font-weight="bold">99.8%</text>

  <!-- Glowing Neon State of Charge (SoC) LED Strip -->
  <rect x="115" y="98" width="170" height="3" fill="url(#neonGlow)" filter="url(#batGlow)" />
  <rect x="115" y="98" width="170" height="2" fill="#6ee7b7" />

  <!-- High-Voltage Hazard Triangle Badge -->
  <polygon points="136,170 144,170 140,163" fill="#f59e0b" stroke="#78350f" stroke-width="0.8" />
  <polygon points="263,170 271,170 267,163" fill="#f59e0b" stroke="#78350f" stroke-width="0.8" />
</svg>

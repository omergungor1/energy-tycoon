<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081b2e" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="windGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#skyGrad)" />

  <!-- Wind Streamlines -->
  <path d="M 20 60 Q 140 40, 260 70 T 380 50" stroke="url(#windGlow)" stroke-width="2.5" fill="none" />
  <path d="M 40 100 Q 180 80, 280 110 T 390 90" stroke="url(#windGlow)" stroke-width="1.8" fill="none" opacity="0.6" />
  <path d="M 10 140 Q 150 125, 270 150 T 380 135" stroke="url(#windGlow)" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Mountain Foothills in Background -->
  <path d="M 0 200 L 70 155 L 160 185 L 260 145 L 340 175 L 400 150 L 400 240 L 0 240 Z" fill="#0f2338" opacity="0.45" />

  <!-- Ground Platform / Concrete Pad -->
  <ellipse cx="200" cy="210" rx="70" ry="14" fill="#1e293b" />
  <ellipse cx="200" cy="208" rx="55" ry="10" fill="#334155" />
  <ellipse cx="200" cy="206" rx="42" ry="7" fill="#475569" />

  <!-- Steel Base Flange -->
  <path d="M 193 206 L 207 206 L 205 198 L 195 198 Z" fill="#64748b" />

  <!-- Tapered Tower -->
  <path d="M 195 198 L 198 62 L 202 62 L 205 198 Z" fill="url(#towerGrad)" />

  <!-- Aviation Beacon Light (Top of Nacelle) -->
  <circle cx="200" cy="56" r="3" fill="#ef4444" filter="url(#glow)" />
  <circle cx="200" cy="56" r="1.5" fill="#ffffff" />

  <!-- Nacelle Housing -->
  <rect x="191" y="58" width="22" height="11" rx="4" fill="#cbd5e1" />
  <rect x="189" y="60" width="4" height="7" rx="1" fill="#475569" />

  <!-- Rotor Hub -->
  <circle cx="209" cy="63.5" r="5" fill="#94a3b8" />
  <circle cx="211" cy="63.5" r="3.5" fill="#64748b" />

  <!-- Blades -->
  <!-- Top Blade -->
  <g transform="translate(209, 63.5)">
    <!-- Upright Blade -->
    <path d="M -1.8 0 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 1.8 0 Z" fill="url(#bladeGrad)" />
    <!-- Red Tip -->
    <path d="M -2.5 -54 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 2.5 -54 Z" fill="#ef4444" />
    
    <!-- Lower Right Blade (120 deg) -->
    <g transform="rotate(120)">
      <path d="M -1.8 0 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 1.8 0 Z" fill="url(#bladeGrad)" />
      <path d="M -2.5 -54 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 2.5 -54 Z" fill="#ef4444" />
    </g>

    <!-- Lower Left Blade (240 deg) -->
    <g transform="rotate(240)">
      <path d="M -1.8 0 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 1.8 0 Z" fill="url(#bladeGrad)" />
      <path d="M -2.5 -54 L -2.8 -62 Q -1.5 -70, 0 -70 Q 1.5 -70, 2.8 -62 L 2.5 -54 Z" fill="#ef4444" />
    </g>
  </g>

  <!-- High-Tech Holographic Energy Flow Arc -->
  <circle cx="209" cy="63.5" r="74" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" fill="none" />
</svg>
